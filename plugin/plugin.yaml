name: runbox
version: 0.1.0
manifest_version: 2
api_version: 1
license: MIT
requires_hermes: ">=0.22.2"
description: Build, run and test Python in an offline per-chat container; check and test results come back as a plain issue list
provides_tools:
  - runbox
provides_hooks:
  - pre_tool_call
  - pre_llm_call
tags: [container, python, testing, dev]
config_schema:
  image: {type: string, default: "python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1", description: "Container image for every chat's box (pin by digest)"}
  idle_minutes: {type: float, default: 15, description: "Stop a chat's container (and, on macOS, the runbox VM) after this many idle minutes"}
  idle_days: {type: float, default: 90, description: "Remove a chat's workspace after this many idle days (matches Hermes' 90-day session auto-prune)"}
  memory: {type: string, default: "1g", description: "Memory limit per container"}
  cpus: {type: float, default: 2, description: "CPU limit per container"}
  docker_host: {type: string, default: "", description: "Docker endpoint; empty = the runbox colima VM on macOS, the default Docker daemon elsewhere"}
  hint: {type: bool, default: true, description: "Add a short note about runbox to each turn"}
  confirm_export: {type: bool, default: false, description: "Ask for approval before every export (off: the user asking for it is the approval)"}
  guard_imports: {type: bool, default: true, description: "Ask before the agent edits an imported original directly with write_file/patch (fixes stay in the box until export)"}
